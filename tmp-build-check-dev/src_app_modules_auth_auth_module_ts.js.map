<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-700 px-4">

  <mat-card class="w-full max-w-md !rounded-3xl !shadow-2xl p-6 bg-white/95 backdrop-blur">

    <!-- Logo -->
    <div class="flex flex-col items-center mb-6">

      <div class="mb-4">
        <img
          src="https://media.licdn.com/dms/image/v2/D4D0BAQGibhoMeCL-mg/company-logo_200_200/company-logo_200_200/0/1667320508791/e_sueldos_logo?e=2147483647&v=beta&t=6BpHD4ZVbBNymqB5aEkJNEXyJ-0qGr2At_F6mEePRAw"
          alt="eSueldos Logo"
          class="auth-logo"
          style="background: white;"
        />
      </div>

      <h1 class="text-3xl font-bold text-gray-800">
        eSueldos
      </h1>

      <p class="text-gray-500 text-sm mt-1">
        Sistema de gestión de sueldos
      </p>

    </div>

    <!-- Título -->
    <mat-card-header class="flex flex-col items-center mb-4">

      <mat-card-title class="!text-2xl !font-semibold text-gray-800">
        Iniciar Sesión
      </mat-card-title>

      <mat-card-subtitle class="mt-1 text-center text-gray-500">
        Ingresa tus credenciales para continuar
      </mat-card-subtitle>

    </mat-card-header>

    <!-- Formulario -->
    <mat-card-content>

      <form
        [formGroup]="loginForm"
        (ngSubmit)="onSubmit()"
        class="flex flex-col gap-5"
      >

        <!-- EMAIL -->
        <div class="input-wrapper">
          <label class="input-label">Correo Electrónico</label>
          <div class="input-container">
            <mat-icon class="input-icon">email</mat-icon>
            <input
              class="custom-input"
              type="email"
              formControlName="email"
              placeholder="ejemplo@correo.com"
            />
          </div>
          <div class="input-error" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')">
            El correo es obligatorio
          </div>
          <div class="input-error" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')">
            Ingresa un correo válido
          </div>
        </div>

        <!-- PASSWORD -->
        <div class="input-wrapper">
          <label class="input-label">Contraseña</label>
          <div class="input-container">
            <mat-icon class="input-icon">lock</mat-icon>
            <input
              class="custom-input"
              [type]="hidePassword ? 'password' : 'text'"
              formControlName="password"
              placeholder="********"
            />
            <button
              mat-icon-button
              type="button"
              (click)="hidePassword = !hidePassword"
              class="toggle-btn"
            >
              <mat-icon>
                {{ hidePassword ? 'visibility_off' : 'visibility' }}
              </mat-icon>
            </button>
          </div>
          <div class="input-error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')">
            La contraseña es obligatoria
          </div>
          <div class="input-error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('minlength')">
            Debe tener al menos 6 caracteres
          </div>
        </div>

        <!-- BOTÓN -->
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="loginForm.invalid || isLoading"
          class="!py-6 mt-2 flex justify-center items-center w-full !rounded-xl !text-lg hover:scale-105 transition-all duration-200"
        >
          <span *ngIf="!isLoading">Ingresar</span>
          <mat-spinner *ngIf="isLoading" diameter="26"></mat-spinner>
        </button>

      </form>

    </mat-card-content>

    <!-- Footer -->
    <mat-card-footer class="text-center mt-6">
      <p class="text-gray-600 text-sm">
        ¿No tienes una cuenta?
        <a
          routerLink="/auth/register"
          class="text-blue-600 font-semibold hover:underline ml-1"
        >
          Regístrate aquí
        </a>
      </p>
    </mat-card-footer>

  </mat-card>

</div>
